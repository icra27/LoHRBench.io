  <section class="section abstract-section" id="abstract" aria-labelledby="abstract-heading">
    <div class="container">
      <div class="section-heading"><p class="eyebrow">The benchmark</p><h2 id="abstract-heading">Abstract</h2></div>
      <p class="abstract-text">Long-horizon manipulation is challenging: as horizons grow, errors compound and small deviations cascade. Modular planning systems and end-to-end policies approach this problem differently, yet are rarely evaluated under the same tasks and protocol. We introduce LOHR-BENCH (Long-Horizon Reasoning Benchmark), a dual-level, method-agnostic arena of 20 tasks across four suites: tool-use, active exploration, clutter, and extended–long–horizon. It supports both modular TAMP methods and end-to-end policies within the same environment. Tasks are specified in Planning Domain Definition Language (PDDL) and grounded in simulators, enabling strategy-independent evaluation through goal predicates. The benchmark provides (i) a data pipeline with synchronized rollouts that align language, symbolic plans, and low-level trajectories. (ii) a concise Gym-style interface supports high-level, low-level and dual-level policies, and (iii) unified metrics for progress, success, decision time, and execution time. Together, these components offer a focused, reproducible testbed for comparing modular and end-to-end approaches and for developing hybrid methods that combine structured planning with learned policies.</p>
      <figure class="benchmark-overview"><img src="./static/images/teaser.png" width="2304" height="1176" loading="lazy" alt="LOHR-BENCH overview: PDDL task design across four suites, synchronized language and trajectory datasets, high-level and low-level policy interfaces, and unified evaluation metrics."><figcaption>A shared environment for modular planning, end-to-end policies, and hybrid methods.</figcaption></figure>
    </div>
  </section>
